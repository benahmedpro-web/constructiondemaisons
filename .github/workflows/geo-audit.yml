name: GEO Audit hebdomadaire

on:
  schedule:
    # Chaque lundi à 8h00 UTC (9h Paris)
    - cron: "0 8 * * 1"
  workflow_dispatch:
    # Déclenchement manuel depuis GitHub Actions

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run GEO audit
        run: node scripts/geo-audit.mjs
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
